# Serves the built panel and forwards /api to the API, so the browser talks to a single origin
# (no CORS needed). The API address is looked up when a request comes, so nginx starts even if the API is not up yet.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

    location /api/ {
        set $api http://api:8080;
        proxy_pass $api;
        # $http_host keeps the port ("localhost:8081"); $host would drop it. A browser sends Origin with every POST,
        # and if the API saw a Host without the port it would take the request for one from another site and refuse it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: any other address is a screen of the panel.
    location / {
        try_files $uri /index.html;
    }

    # File names carry a hash, so they can be cached for good; the page itself must not be.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
